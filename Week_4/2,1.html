<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        text-align: center;
        margin-top: 40px;
        color: #1f2937;
      }
      h1 {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1 id="judul">Halo, Dunia!</h1>
    <p>Buka console untuk melihat pesan tambahan dari JavaScript.</p>

    <script>
        const harga = 150000;
        const diskonPersen = 20;
        const potongan = harga * (diskonPersen / 100);
        const hargaAkhir = harga - potongan;
        console.log(`Harga awal: Rp${harga}`);
        console.log(`Diskon ${diskonPersen}% = Rp${potongan}`);
        console.log(`Harga akhir: Rp${hargaAkhir}`);
        const status = hargaAkhir < 100000 ? "Murah" : "standar";
        console.log(`Kategori harga: ${status}`);
    </script>
  </body>
</html>
