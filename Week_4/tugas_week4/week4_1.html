<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 2.1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 32px;
        color: #1f2937;
      }
      .card {
        max-width: 700px;
        margin: auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      h2 {
        color: #2563eb;
      }
      pre {
        background: #111827;
        color: #e5e7eb;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Soal 2.1 - Variabel dan tipe data</h2>
      <pre><code>let nama = "Argha";
const umur = 19;
let sudahLulus = true;
console.log(nama, umur, sudahLulus);
console.log(typeof nama, typeof umur, typeof sudahLulus);</code></pre>

      <script>
        let nama = "Argha";
        const umur = 19;
        let sudahLulus = true;

        console.log(nama, umur, sudahLulus);
        console.log(typeof nama, typeof umur, typeof sudahLulus);
      </script>
    </div>
  </body>
</html>
