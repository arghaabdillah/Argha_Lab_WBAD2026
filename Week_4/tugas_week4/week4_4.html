<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 3.3</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        margin: 0;
        padding: 32px;
      }
      .card {
        max-width: 700px;
        margin: auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }
      input, button {
        padding: 10px 12px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Soal 3.3 - Kondisi IF/ELSE</h2>
      <label for="nilai">Masukkan nilai:</label><br />
      <input type="number" id="nilai" min="0" max="100" />
      <button onclick="cekNilai()">Cek</button>
      <p id="statusNilai"></p>

      <script>
        function cekNilai() {
          const nilai = Number(document.getElementById('nilai').value);
          let status = '';

          if (nilai >= 80) {
            status = 'Lulus dengan predikat sangat baik';
          } else if (nilai >= 60) {
            status = 'Lulus';
          } else {
            status = 'Belum lulus';
          }

          document.getElementById('statusNilai').textContent = `Status: ${status}`;
        }
      </script>
    </div>
  </body>
</html>
