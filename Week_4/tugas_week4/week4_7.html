<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 6.1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        padding: 32px;
      }
      .card {
        max-width: 700px;
        margin: auto;
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Soal 6.1 - Function</h2>
      <script>
        function hitungLuasPersegi(sisi) {
          return sisi * sisi;
        }

        const luas = hitungLuasPersegi(12);
        document.write('<p>Luas persegi dengan sisi 12 adalah: ' + luas + '</p>');
      </script>
    </div>
  </body>
</html>
