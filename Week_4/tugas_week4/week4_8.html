<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 7.1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        padding: 32px;
      }
      .card {
        max-width: 700px;
        margin: auto;
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      }
      button {
        margin-top: 12px;
        padding: 10px 16px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Soal 7.1 - Event onclick</h2>
      <button onclick="ubahWarna()">Klik untuk ubah warna</button>
      <p id="status">Warna sedang normal.</p>

      <script>
        function ubahWarna() {
          const body = document.body;
          const status = document.getElementById('status');

          if (body.style.backgroundColor === 'lightgreen') {
            body.style.backgroundColor = '#eef2ff';
            status.textContent = 'Warna sedang normal.';
          } else {
            body.style.backgroundColor = 'lightgreen';
            status.textContent = 'Warna berhasil diubah!';
          }
        }
      </script>
    </div>
  </body>
</html>
