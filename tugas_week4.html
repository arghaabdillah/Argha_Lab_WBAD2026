<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 2.1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .box {
        background: white;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        color: #1f3a5f;
        margin-bottom: 15px;
      }

      p {
        font-size: 20px;
        color: #2d3e50;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Latihan 2.1</h1>
      <p id="hasil"></p>
    </div>

    <script>
      let nilaiUjian = 75;
      let status = nilaiUjian > 60 ? 'Lulus' : 'Tidak Lulus';

      document.getElementById('hasil').textContent = `Nilai ${nilaiUjian} -> ${status}`;
      console.log(`Nilai ${nilaiUjian} -> ${status}`);
    </script>
  </body>
</html>
